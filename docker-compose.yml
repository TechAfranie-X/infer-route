services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  inferroute:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: "8000"
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_TIMEOUT_SECONDS: "2"
    depends_on:
      redis:
        condition: service_healthy
