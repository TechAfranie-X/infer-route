services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-a:
    build: .
    command: ["python", "-m", "app.mock"]
    environment:
      MOCK_PROVIDER_ID: provider-a
      MOCK_LATENCY_MS: "150"
      MOCK_FAILURE_RATE: "0.02"
      HOST: 0.0.0.0
      MOCK_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-b:
    build: .
    command: ["python", "-m", "app.mock"]
    environment:
      MOCK_PROVIDER_ID: provider-b
      MOCK_LATENCY_MS: "300"
      MOCK_FAILURE_RATE: "0.01"
      HOST: 0.0.0.0
      MOCK_PORT: "8082"
    ports:
      - "8082:8082"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-c:
    build: .
    command: ["python", "-m", "app.mock"]
    environment:
      MOCK_PROVIDER_ID: provider-c
      MOCK_LATENCY_MS: "100"
      MOCK_FAILURE_RATE: "0.10"
      HOST: 0.0.0.0
      MOCK_PORT: "8083"
    ports:
      - "8083:8083"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  inferroute:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: "8000"
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_TIMEOUT_SECONDS: "2"
      PROVIDERS_CONFIG_PATH: config/providers.json
      HTTP_CONNECT_TIMEOUT_SECONDS: "2"
      HTTP_READ_TIMEOUT_SECONDS: "20"
    depends_on:
      redis:
        condition: service_healthy
      mock-a:
        condition: service_healthy
      mock-b:
        condition: service_healthy
      mock-c:
        condition: service_healthy
